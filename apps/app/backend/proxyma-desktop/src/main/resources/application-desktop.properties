spring.application.name=proxyma
# Filtered from the pom at build time by spring-boot-starter-parent's own resource
# filtering (@...@ delimiters, application*.properties). The pom is therefore the ONE
# place a version is written, which matters because release-desktop.yml validates the git
# tag against the pom and nothing was validating this line: a hardcoded value could - and
# did - sit at 1.0.0 while an installer shipped as v0.1.0. Everything downstream reads
# THIS value, not the filename: the version in the UI and /api/v1/config, UpdateService's
# comparison against the latest release (a stale value makes the app offer an update to
# the build it is already running), and the appVersion stamped on every feedback
# submission.
spring.application.version=@project.version@
spring.main.web-application-type=reactive
server.port=4246
# LOOPBACK, unless the package says otherwise (editions-assembly-01). Nothing set this, so Netty bound
# every interface and a machine on the same network reached an install with no accounts - with a
# Host header it wrote itself as the only check. ProxymaLauncher pins the same value on the command
# line, where the environment cannot override it; the Home Server image sets
# PROXYMA_SERVER_ADDRESS=0.0.0.0, because inside a container loopback is unreachable from the
# published port, and its access code is what guards it there (AccessGate).
server.address=${PROXYMA_SERVER_ADDRESS:127.0.0.1}
# How much of one request body is held in heap - the same as Enterprise Server's, so a request that
# works on one edition works on the other (editions-assembly-11). Spring's default was 256KB here
# and 200MB there. An upload's file part beyond it is spooled to disk, not refused.
spring.codec.max-in-memory-size=4MB

# H2 databases: the source registry (local_folders, which holds EVERY source despite its name),
# diagnostics, chat history and evaluation. The six per-connector files beside them (jira_projects,
# svn_repos, ...) were removed on 2026-09-29 - they mapped packages that no longer exist and were
# created empty on every start.
#
# AUTO_SERVER IS OFF unless a developer turns it on (proxyma.h2.auto-server=TRUE), since 2026-10-14
# (editions-assembly-17). It starts a TCP server per database on every interface, user sa with an
# empty password, and writes its address and key into the .lock.db beside the file - a developer's
# way to open a live database from another tool, shipped to every customer.
spring.datasource.local.url=jdbc:h2:file:${proxyma.data.dir}/local_folders;LOCK_TIMEOUT=10000;AUTO_SERVER=${proxyma.h2.auto-server:FALSE}
spring.datasource.local.driver-class-name=org.h2.Driver
spring.datasource.local.username=sa
spring.datasource.local.password=

spring.datasource.diagnostics.url=jdbc:h2:file:${proxyma.data.dir}/diagnostics;LOCK_TIMEOUT=10000;AUTO_SERVER=${proxyma.h2.auto-server:FALSE}
spring.datasource.diagnostics.driver-class-name=org.h2.Driver
spring.datasource.diagnostics.username=sa
spring.datasource.diagnostics.password=

spring.datasource.chat.url=jdbc:h2:file:${proxyma.data.dir}/chat_history;LOCK_TIMEOUT=10000;AUTO_SERVER=${proxyma.h2.auto-server:FALSE}
spring.datasource.chat.driver-class-name=org.h2.Driver
spring.datasource.chat.username=sa
spring.datasource.chat.password=

# Evaluation Mode instrumentation (chat/search latency, anonymized transcripts). Written only
# while the Settings -> Evaluation toggle is on; deliberately its own file so clearing it never
# touches chat_history - see EvaluationDataSourceConfig.
spring.datasource.evaluation.url=jdbc:h2:file:${proxyma.data.dir}/evaluation;LOCK_TIMEOUT=10000;AUTO_SERVER=${proxyma.h2.auto-server:FALSE}
spring.datasource.evaluation.driver-class-name=org.h2.Driver
spring.datasource.evaluation.username=sa
spring.datasource.evaluation.password=
# Copies of chat media referenced by an anonymized transcript - kept out of the conversations dir
# so the originals are never served from the evaluation surface.
proxyma.evaluation-media-dir=${proxyma.data.dir}/evaluation-media

# Auto-update: GitHub Releases API URL for the public proxyma-releases repo.
#
# This is BAKED INTO THE INSTALLER at build time, so a release shipped with it blank never
# auto-updates no matter what is set later - the installed copy has no idea where to look.
# UpdateService treats a blank value as UP_TO_DATE and stops, silently.
#
# The repository must be PUBLIC: UpdateService sends no Authorization header, so a private
# repo answers 404 and every check reports "up to date" forever.
proxyma.updates.releases-api-url=https://api.github.com/repos/proxyma-ai/proxyma-releases

# ChromaDB's port is chosen free at every start (ChromaStoreService) unless proxyma.chromadb.port
# names one. It was pinned to 8000 here - chroma's own default - and a user's own chroma on that
# port was adopted as Proxyma's (editions-assembly-06).

# MCP server
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.name=proxyma
spring.ai.mcp.server.capabilities.tool=true

# webFetch JS rendering: auto = use the headless-browser fallback only for pages that look like
# unrendered client-side SPAs; off = never render, always use the raw static HTML.
proxyma.web-fetch.js-rendering=auto
# webFetch JS-render engine: htmlunit = pure-Java HtmlUnit, no browser binary; playwright = real
# headless Chromium; auto = Playwright if available, else HtmlUnit.
#
# auto now that the desktop bundle carries a headless Chromium: Playwright first, HtmlUnit as the
# fallback. It was pinned to htmlunit with no override at all, which made the stronger engine
# unreachable no matter what the user wanted - and HtmlUnit does not cope with a heavy JS site.
#
# auto rather than playwright deliberately. A build that ships without the browser, or a machine
# where launching it fails, degrades to HtmlUnit instead of returning nothing; `playwright` would
# make a missing binary a hard loss of the feature. See installBrowserIfBundled in ProxymaLauncher,
# which treats an absent archive as a supported configuration rather than an error.
proxyma.web-fetch.js-engine=${PROXYMA_WEB_FETCH_JS_ENGINE:auto}

# Logging
# Follows proxyma.log.dir (set by the launcher, or by ProxymaDesktopApplication when this
# jar is run directly) so it names the file logback actually writes. It was a bare
# relative path, which resolved against the working directory - unwritable under the
# .deb's /opt/proxyma - and left LogTailProvider pointing at a file that never existed.
logging.file.name=${proxyma.log.dir:logs}/proxyma.log
# The rolling policy and levels are logback.xml's: Spring Boot uses that file as it finds it, so the
# logging.logback.rollingpolicy.* properties that sat here never did anything (editions-assembly-12).

# Where feedback and telemetry are sent. Until this was set, the property did not exist in
# any properties file or deploy env, so TelemetryShipper.flush() returned early on the
# blank-URL check every time and NOTHING has ever been shipped from any installation.
#
# Overridable per deployment (PROXYMA_TELEMETRY_SERVER_URL), and setting it EMPTY is a
# supported configuration meaning "send nothing anywhere" - an air-gapped install, or a
# customer who wants the product to have no outbound path at all. Feedback then stays in
# the local mirror and the modal says so rather than claiming it was sent.
proxyma.telemetry.server.url=${PROXYMA_TELEMETRY_SERVER_URL:https://telemetry.proxyma.ai}

# Guardrail policy corpus - the rule documents an operator uploads, and the manifest describing
# them. Beside the databases in the data directory, NOT under the install root: the same reason
# the Python runtime and the vector store live here, and the same reason the .deb cannot write
# to its root-owned /opt/proxyma.
proxyma.guardrail.policies-dir=${proxyma.data.dir}/guardrail-policies

# How long a graceful shutdown waits for in-flight requests before it stops waiting.
#
# FIVE SECONDS, NOT THE DEFAULT THIRTY, AND THE SSE STREAM IS WHY. The SPA subscribes to
# EventStreamController for as long as a tab is open, and a server-sent-event stream is an
# active request that never completes - so on desktop the graceful phase ALWAYS ran its full
# timeout and always ended with "Graceful shutdown aborted with one or more requests still
# active". Thirty seconds of waiting for a request that cannot finish, on every quit, on the
# one edition where there is exactly one user and they are sitting in front of it.
#
# Five still covers what the wait is actually for: a sync request or a chat completion in
# flight when the user quits. It is not a correctness boundary either way - the request is
# abandoned when the timeout expires at whatever value it holds.
#
# DESKTOP ONLY. proxyma-server keeps the default, where in-flight requests belong to other
# people and 30s of patience is worth having.
spring.lifecycle.timeout-per-shutdown-phase=5s

# How many sources sync at once (maintainer's feedback on 0.26.0, 2026-10-04: "avoid syncing all
# the sources at a time"). Two sources list their contents at once and the rest wait their turn
# (SyncOrchestratorService.waitingForSlot); four take turns fetching and embedding what was found.
# A source somebody presses "Sync now" on still starts at once. One person's machine - which also
# answers that person's searches while it syncs - not a server with many owners, which keeps 8 and 16.
proxyma.sync.max-concurrent-syncs=2
proxyma.sync.max-concurrent-drains=4
