{{- $fullname := include "proxyma.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "proxyma-common.labels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  # One, and not a value: H2, the keyword index and ChromaDB are one process's files. A second
  # replica on the same volume would corrupt them.
  replicas: 1
  serviceName: {{ $fullname }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  {{- if not .Values.persistence.existingClaim }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ ternary "Retain" "Delete" .Values.persistence.retainOnDelete }}
    whenScaled: Retain
  {{- end }}
  selector:
    matchLabels:
      {{- include "proxyma-common.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "proxyma-common.selectorLabels" (dict "ctx" . "component" "app") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "proxyma-common.serviceAccountName" . }}
      # The application never talks to the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "proxyma-common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: proxyma
          image: {{ include "proxyma-common.image" (dict "image" .Values.image "default" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4246
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullname }}
            {{- with .Values.config.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "proxyma-common.secretEnv" (dict "ctx" . "name" "PROXYMA_ACCESS_CODE" "key" "access-code") | nindent 12 }}
            {{- include "proxyma-common.secretEnv" (dict "ctx" . "name" "PROXYMA_CREDENTIAL_KEY" "key" "credential-key") | nindent 12 }}
            {{- include "proxyma-common.secretEnv" (dict "ctx" . "name" "PROXYMA_SANDBOX_TOKEN" "key" "sandbox-token") | nindent 12 }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- include "proxyma.probe" .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- include "proxyma.probe" .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- include "proxyma.probe" .Values.probes.readiness | nindent 12 }}
          lifecycle:
            # Let the endpoint removal reach every proxy before the listener closes.
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if not .Values.persistence.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "proxyma-common.selectorLabels" (dict "ctx" . "component" "app") | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
