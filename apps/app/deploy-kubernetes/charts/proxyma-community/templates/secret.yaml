{{- if not .Values.secrets.existingSecret }}
{{- if and .Values.access.code (lt (len .Values.access.code) 16) }}
{{- fail "access.code must be 16 characters or more" }}
{{- end }}
{{- $data := dict }}
{{- with .Values.access.code }}{{ $_ := set $data "access-code" (b64enc .) }}{{ end }}
{{- with .Values.secrets.credentialKey }}{{ $_ := set $data "credential-key" (b64enc .) }}{{ end }}
{{- if .Values.office.enabled }}{{ $_ := set $data "sandbox-token" (include "proxyma-common.sandboxToken" . | b64enc) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxyma-common.secretName" . }}
  labels:
    {{- include "proxyma-common.labels" (dict "ctx" . "component" "app") | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
