# Builds and tests Proxyma Community on GitHub-hosted runners: every pull request and every push to
# main. The same script the maintainer's pipeline runs before a release is published here
# (tools/oss/verify-community.sh): each module's tests, the desktop jar with its web interface, the
# frontend tests and the translation catalogs.
name: Community

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and test Proxyma Community
        run: bash tools/oss/verify-community.sh .

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
